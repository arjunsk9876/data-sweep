[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-sweep"
version = "0.5.0"
description = "Scan a CSV, fix common data quality issues, audit for hidden entity and temporal leakage with runnable fixes, and explain what changed."
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "scikit-learn>=1.0",
    "mcp>=2.0,<3.0; python_version >= '3.10'",
]
fix = [
    "scikit-learn>=1.0",
]
mcp = [
    "mcp>=2.0,<3.0; python_version >= '3.10'",
]

[project.scripts]
data-sweep = "run:main"

[tool.setuptools]
packages = ["data_sweep", "data_sweep.detectors", "data_sweep.entity_leakage"]
py-modules = ["run"]

[tool.mypy]
python_version = "3.9"
files = ["data_sweep", "run.py"]
ignore_missing_imports = true
